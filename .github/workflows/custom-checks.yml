name: ZLaunch checks
on:
  push:
    branches: [custom/main]
  pull_request:
    branches: [custom/main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Select Xcode 26
        run: |
          XCODE_PATH="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n1)"
          echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> "$GITHUB_ENV"
      - run: brew install swiftlint xcodegen
      - run: ./Custom/check.sh
