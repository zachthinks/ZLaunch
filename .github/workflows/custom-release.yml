name: ZLaunch release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zlaunch-release
  cancel-in-progress: false
jobs:
  preflight:
    if: github.event.repository.private == false && github.repository == 'zachthinks/ZLaunch' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/custom/main' && vars.ZLAUNCH_HOSTED_RELEASE_ENABLED == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select Xcode 26
        run: |
          XCODE_PATH="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n1)"
          test -n "$XCODE_PATH"
          echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> "$GITHUB_ENV"
      - run: brew install swiftlint xcodegen
      - run: ./Custom/check.sh
  release:
    needs: preflight
    if: github.event.repository.private == false && github.repository == 'zachthinks/ZLaunch' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/custom/main' && vars.ZLAUNCH_HOSTED_RELEASE_ENABLED == 'true' && needs.preflight.result == 'success'
    environment: zlaunch-release
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm the tested commit is still current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin custom/main
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git switch -c custom/main "$GITHUB_SHA"
          node Custom/verify-config.mjs
          VERSION="$(node -p 'require("./Custom/release.json").version')"
          RELEASES="$(gh api --paginate --slurp repos/zachthinks/ZLaunch/releases)"
          printf '%s' "$RELEASES" | VERSION="$VERSION" node -e '
            let input=""; process.stdin.on("data", x => input+=x);
            process.stdin.on("end", () => {
              if (JSON.parse(input).flat().some(r => r.tag_name === "v"+process.env.VERSION))
                throw new Error("Version already exists, including drafts; no overwrite.");
            });'
      - name: Select Xcode 26
        run: |
          XCODE_PATH="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n1)"
          test -n "$XCODE_PATH"
          echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> "$GITHUB_ENV"
      - name: Import signing identity into a temporary keychain
        env:
          P12_BASE64: ${{ secrets.ZLAUNCH_SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.ZLAUNCH_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$P12_BASE64" && test -n "$P12_PASSWORD"
          KEYCHAIN="$RUNNER_TEMP/zlaunch.keychain-db"
          KPW="$(openssl rand -base64 24)"
          echo "::add-mask::$KPW"
          trap 'rm -f "$RUNNER_TEMP/signing.p12"' EXIT
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$KPW" "$KEYCHAIN"
          security set-keychain-settings -lut 7200 "$KEYCHAIN"
          security unlock-keychain -p "$KPW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KPW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -F 'Developer ID Application: Zachary Linquist (FVY9AS28CU)'
      - name: Configure notarization in the temporary keychain
        env:
          APPLE_ID: ${{ secrets.ZLAUNCH_APPLE_ID }}
          APP_PASSWORD: ${{ secrets.ZLAUNCH_APP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$APPLE_ID" && test -n "$APP_PASSWORD"
          xcrun notarytool store-credentials ZLaunch-CI --apple-id "$APPLE_ID" --team-id FVY9AS28CU --password "$APP_PASSWORD" --keychain "$RUNNER_TEMP/zlaunch.keychain-db"
      - name: Sign, notarize, package, publish
        env:
          GH_TOKEN: ${{ github.token }}
          NOTARY_PROFILE: ZLaunch-CI
          NOTARY_KEYCHAIN: ${{ runner.temp }}/zlaunch.keychain-db
          BUILD_NUMBER: ${{ github.run_number }}
          CHECKS_VERIFIED: 1
        run: ./Custom/publish.sh
      - name: Remove temporary signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/signing.p12"
          security delete-keychain "$RUNNER_TEMP/zlaunch.keychain-db" || true
