name: ZLaunch upstream sync
on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:
    inputs:
      verify_current_release:
        description: Check and attest an unpublished stable custom update already on custom/main
        type: boolean
        required: true
        default: false
      expected_commit:
        description: Full reviewed custom/main SHA required for a custom update
        type: string
        required: false
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: zlaunch-upstream-sync
  cancel-in-progress: false
jobs:
  sync:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    outputs:
      candidate: ${{ steps.sync.outputs.candidate }}
      base: ${{ steps.sync.outputs.base }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: custom/main
          fetch-depth: 0
      - name: Prepare upstream candidate
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_CURRENT_RELEASE: ${{ inputs.verify_current_release }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          git config user.name 'ZLaunch sync'
          git config user.email 'zlaunch-sync@users.noreply.github.com'
          git remote add upstream https://github.com/abue-ammar/tinycast.git
          mkdir -p build
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$VERIFY_CURRENT_RELEASE" = true ]; then
            node Custom/prepare-custom-release.mjs
            exit 0
          fi
          node Custom/sync.mjs
          BRANCH="$(git branch --show-current)"
          if [ "$BRANCH" != custom/main ]; then
            git push origin "$BRANCH"
            printf '%s\n' 'An upstream release has been merged into the custom branch. Automated checks must pass before merging. UI and updater changes need a manual smoke check.' > build/sync-pr.md
            if [ "$(gh pr list --base custom/main --head "$BRANCH" --state open --json number --jq 'length')" = 0 ]; then
              gh pr create --base custom/main --head "$BRANCH" --title 'Update ZLaunch from upstream' --body-file build/sync-pr.md
            fi
            echo "candidate=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
      - name: Record conflict report
        if: failure()
        run: |
          if [ -f build/sync-conflicts.txt ]; then
            cat build/sync-conflicts.txt
            {
              printf '%s\n' '## Upstream merge needs attention' '' '```text'
              cat build/sync-conflicts.txt
              printf '%s\n' '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
  checks:
    needs: sync
    if: github.event.repository.private == false && needs.sync.outputs.candidate != ''
    uses: ./.github/workflows/custom-checks.yml
    with:
      ref: ${{ needs.sync.outputs.candidate }}
    permissions:
      contents: read
  promote:
    needs: [sync, checks]
    if: github.event.repository.private == false && needs.checks.result == 'success' && needs.sync.outputs.candidate != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.sync.outputs.candidate }}
          fetch-depth: 0
      - name: Promote the exact checked candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKED_COMMIT: ${{ needs.sync.outputs.candidate }}
          SYNC_BASE: ${{ needs.sync.outputs.base }}
        run: node Custom/promote.mjs
      - name: Report promotion failure
        if: failure()
        run: echo 'Checked candidate was not promoted. Review the failed step; production and existing releases remain unchanged.' >> "$GITHUB_STEP_SUMMARY"
